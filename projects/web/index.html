<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>한승재 · Ask Me Anything</title>
  <meta name="description" content="한승재의 자기소개 문서를 근거로 답변하는 RAG 챗봇" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ctext x='16' y='21.5' font-family='sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3E%ED%95%9C%3C/text%3E%3C/svg%3E" />
  <!-- 저장된 테마를 렌더링 전에 적용해서 깜빡임을 막는다 -->
  <script>
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" id="owner">한승재</a>
    <nav class="links">
      <button id="reset" class="link" type="button" hidden>새 대화</button>
      <a class="link" href="https://github.com/hseungjae" target="_blank" rel="noopener">GitHub</a>
      <a class="link" href="https://hseungjae.notion.site/portfolio" target="_blank" rel="noopener">Notion</a>
      <button class="theme" id="theme" type="button" aria-label="테마 변경">
        <svg class="i-system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="i-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </header>

  <main class="wrap">
    <section class="intro" id="intro">
      <p class="eyebrow">Cloud Engineer</p>
      <h1>읽는 대신,<br>대화로 소개합니다.</h1>
      <p class="sub">자기소개 문서에서 관련 내용을 찾아 그 내용만으로 답하는 RAG 챗봇입니다.</p>

      <ul class="suggest" id="suggest">
        <li><button type="button">어떤 사람인가요?</button></li>
        <li><button type="button">학력이 어떻게 되나요?</button></li>
        <li><button type="button">기능경기대회 성적은?</button></li>
        <li><button type="button">트러블슈팅 경험이 있나요?</button></li>
        <li><button type="button">어떤 프로젝트를 했나요?</button></li>
        <li><button type="button">지금 어디서 일하나요?</button></li>
      </ul>
    </section>

    <section class="log" id="log" aria-live="polite"></section>
  </main>

  <footer class="dock">
    <form id="form" class="composer">
      <textarea id="q" rows="1" maxlength="500" placeholder="질문을 입력하세요" aria-label="질문"></textarea>
      <button id="send" type="submit" aria-label="보내기" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </footer>
  <script src="/static/app.js"></script>
</body>
</html>
