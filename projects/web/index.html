<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Me Anything</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">AI 자기소개</p>
      <h1>안녕하세요, <span id="owner">한승재</span>입니다.<br>궁금한 건 편하게 물어보세요</h1>
      <p class="sub"><span class="badge">RAG</span> 검색 증강 생성(RAG) 기반 챗봇이에요. 자기소개 문서에서 관련 내용을 먼저 찾고, 그 내용만 근거로 답변합니다. 답변마다 참고한 문서가 표시돼요.</p>
    </header>

    <section class="chat" aria-live="polite">
      <div id="log" class="log">
        <div class="empty" id="empty">
          <p>이런 걸 물어볼 수 있어요</p>
          <div class="chips">
            <button>한승재는 어떤 사람인가요?</button>
            <button>기능경기대회가 뭔가요?</button>
            <button>기능경기대회 성적은?</button>
            <button>트러블슈팅 경험이 있나요?</button>
            <button>어떤 프로젝트를 했나요?</button>
          </div>
        </div>
      </div>
      <form id="form" class="composer">
        <input id="q" autocomplete="off" maxlength="500" placeholder="질문을 입력하세요" />
        <button id="send" type="submit" aria-label="보내기">↑</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
