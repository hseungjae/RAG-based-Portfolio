# 클러스터 안 주소: grafana.monitoring.svc.cluster.local
#   80 → 컨테이너 3000, 화면 (cloudflared 가 chat-grafana.sjhan.com 으로 연결, k3s/infra/cloudflared/configmap.yaml)
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
  type: ClusterIP
