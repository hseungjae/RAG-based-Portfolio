# kubectl apply -k k3s/cluster/monitoring
# 대시보드 JSON(grafana/dashboards/)은 configMapGenerator 가 ConfigMap 으로 묶는다
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - victoria-metrics/service-account.yaml
  - victoria-metrics/configmap.yaml
  - victoria-metrics/statefulset.yaml
  - victoria-metrics/service.yaml
  - node-exporter/daemonset.yaml
  - kube-state-metrics/service-account.yaml
  - kube-state-metrics/deployment.yaml
  - kube-state-metrics/service.yaml
  - grafana/configmap.yaml
  - grafana/volume.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - grafana/dashboards/cluster.json
      - grafana/dashboards/api.json
      - grafana/dashboards/questions.json
generatorOptions:
  # 이름이 바뀌지 않아야 grafana/deployment.yaml 의 볼륨이 그대로 찾는다
  disableNameSuffixHash: true
