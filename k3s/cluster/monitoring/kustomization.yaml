# kubectl apply -k k3s/cluster/monitoring
# 대시보드 JSON(dashboards/)을 ConfigMap 으로 묶어야 해서 이 폴더만 kustomize 로 적용한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - victoria-metrics.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - grafana.yaml
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/cluster.json
      - dashboards/api.json
      - dashboards/questions.json
generatorOptions:
  # 이름이 바뀌지 않아야 grafana.yaml 의 볼륨이 그대로 찾는다
  disableNameSuffixHash: true
