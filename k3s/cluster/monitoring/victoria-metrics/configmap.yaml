# 수집 대상 목록. VictoriaMetrics 가 -promscrape.config 로 읽어 30초마다 직접 수집한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      # VictoriaMetrics 자신
      - job_name: victoria-metrics
        static_configs:
          - targets: ["localhost:8428"]

      # 노드 CPU·메모리·디스크 (node-exporter/daemonset.yaml)
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [monitoring] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:9100"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      # 파드·Deployment 상태, 재시작 횟수, 리소스 limit (kube-state-metrics/deployment.yaml)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # 컨테이너별 CPU·메모리 (kubelet 에 내장된 cAdvisor)
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        # cAdvisor 는 지표가 아주 많아서 대시보드에 쓰는 것만 남긴다
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total)
            action: keep

      # 챗봇 API 서버 (projects/system/webapp/metrics.py)
      - job_name: system
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [rag-portfolio] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: system
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
