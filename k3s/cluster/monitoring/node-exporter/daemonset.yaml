# 노드마다 하나씩 떠서 호스트의 CPU·메모리·디스크 지표를 내보낸다
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1
          args:
            - --path.rootfs=/host
            - --web.listen-address=:9100
          ports:
            - containerPort: 9100
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "48Mi"
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath:
            path: /
