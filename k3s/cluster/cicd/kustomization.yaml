# kubectl apply -k k3s/cluster/cicd
# agent-pod.yaml 은 클러스터에 직접 적용하지 않는다 (jenkins/Jenkinsfile 이 빌드할 때마다 읽어서 띄운다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - service-account.yaml         # Jenkins 본체: 에이전트 파드 생성·삭제
  - agent-service-account.yaml   # 에이전트 파드: rag-portfolio 배포
  - volume.yaml
  - deployment.yaml
  - service.yaml
