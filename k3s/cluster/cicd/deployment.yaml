# Jenkins 본체(LTS). https://chat-jenkins.sjhan.com 으로 Cloudflare Tunnel 을 통해 연다 (k3s/infra/cloudflared/configmap.yaml).
# 본체에서는 빌드하지 않고, 빌드할 때마다 에이전트 파드(agent-pod.yaml)를 띄운다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  revisionHistoryLimit: 1
  # 데이터 볼륨(ReadWriteOnce)을 한 파드만 쓸 수 있어서, 새 파드를 띄우기 전에 이전 파드를 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins-admin
      # 메모리 여유가 더 많은 k3s-2 에 둔다
      nodeSelector:
        kubernetes.io/hostname: k3s-2
      securityContext:
        runAsUser: 1000
        fsGroup: 1000   # PVC 를 jenkins 사용자(1000)가 쓸 수 있게 한다
      containers:
        - name: jenkins
          image: jenkins/jenkins:2.580.2-lts-jdk21
          ports:
            - name: http
              containerPort: 8080
            - name: agent
              containerPort: 50000   # 빌드 에이전트 파드가 붙는 포트
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=50"   # 힙은 메모리 상한의 절반까지
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
          # 처음 뜰 때나 플러그인을 설치한 뒤에는 시작이 몇 분 걸릴 수 있다
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-pvc   # volume.yaml
