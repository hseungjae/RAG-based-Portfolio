# 자기소개 문서(dataset/profile)를 임베딩해 DB 에 넣는다. DB 가 아직 준비 전이면 실패 후 재시도한다.
# 자기소개 문서가 바뀌면 Jenkins 가 새 이미지로 이 Job 을 다시 실행한다 (jenkins/Jenkinsfile 의 Ingest profile 단계).
apiVersion: batch/v1
kind: Job
metadata:
  name: system-ingest
  namespace: rag-portfolio
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ingest
          image: ghcr.io/hseungjae/rag-based-portfolio/system:latest
          command: ["python", "-m", "scripts.ingest"]
          envFrom:
            - secretRef:
                name: system-secret
            - secretRef:
                name: database-secret
