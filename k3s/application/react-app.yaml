apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  namespace: rag-portfolio
spec:
  revisionHistoryLimit: 1
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          # Jenkins 가 GHCR 에 올린 이미지. 배포할 때 Jenkins 가 커밋 해시 태그로 바꾼다 (jenkins/Jenkinsfile)
          image: ghcr.io/hseungjae/rag-based-portfolio/react-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: react-app
  namespace: rag-portfolio
  labels:
    app: react-app
spec:
  selector:
    app: react-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  type: ClusterIP
