# Cloudflare Tunnel 을 클러스터 안에서 실행한다. 서버 포트를 열 필요가 없다.
# 주소별 연결 설정은 configmap.yaml, 터널 자격 증명은 cloudflared-secret 으로 넣는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: rag-portfolio
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yml", "run"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared-config   # configmap.yaml
        - name: creds
          secret:
            secretName: cloudflared-secret   # k3s/sealedsecret/cloudflared-sealedsecret.yaml
