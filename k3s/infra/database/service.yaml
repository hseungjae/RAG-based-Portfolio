# 클러스터 안 주소: postgres.rag-portfolio.svc.cluster.local (헤드리스: 가상 IP 없이 postgres-0 파드로 바로 연결)
#   5432 → PostgreSQL (system, 적재 Job, Grafana 가 접속)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rag-portfolio
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
  clusterIP: None
