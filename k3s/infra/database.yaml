# 최초 실행 때 한 번만 적용되는 스키마. deploy/local/postgresql/00-init.sql 과 같아야 한다.
# (HNSW 인덱스는 청크가 많아질 때를 위한 것으로, 지금 규모에서는 Postgres 가 순차 스캔을 쓴다)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: rag-portfolio
data:
  00-init.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;

    CREATE TABLE IF NOT EXISTS profile_chunk (
        chunk_id   INTEGER PRIMARY KEY,
        source     TEXT NOT NULL,
        title      TEXT NOT NULL,
        content    TEXT NOT NULL,
        embedding  vector(1024) NOT NULL
    );

    CREATE INDEX IF NOT EXISTS profile_chunk_embedding_idx
        ON profile_chunk USING hnsw (embedding vector_cosine_ops);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rag-portfolio
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
            - name: pg-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
      volumes:
        - name: pg-init
          configMap:
            name: postgres-init
  # k3s 기본 스토리지(local-path). 파드를 다시 만들어도 데이터가 남는다.
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rag-portfolio
spec:
  ports:
    - port: 5432
  clusterIP: None
  selector:
    app: postgres
