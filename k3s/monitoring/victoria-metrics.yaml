# 지표 수집·저장소. Prometheus 와 같은 방식(PromQL)으로 조회하지만 메모리를 훨씬 적게 쓴다.
# 별도 수집기 없이 -promscrape.config 로 직접 수집한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: monitoring
---
# 수집 대상(노드, 파드)을 찾고 kubelet 의 cAdvisor 지표를 읽을 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      # VictoriaMetrics 자신
      - job_name: victoria-metrics
        static_configs:
          - targets: ["localhost:8428"]

      # 노드 CPU·메모리·디스크 (node-exporter.yaml)
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [monitoring] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:9100"
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance

      # 파드·Deployment 상태, 재시작 횟수, 리소스 limit (kube-state-metrics.yaml)
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # 컨테이너별 CPU·메모리 (kubelet 에 내장된 cAdvisor)
      - job_name: cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
        # cAdvisor 는 지표가 아주 많아서 대시보드에 쓰는 것만 남긴다
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total)
            action: keep

      # 챗봇 API 서버 (projects/system/webapp/metrics.py)
      - job_name: system
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [rag-portfolio] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: system
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: "$1:8000"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  serviceName: victoria-metrics
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      serviceAccountName: victoria-metrics
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.155.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=15d
            - -promscrape.config=/config/scrape.yml
          ports:
            - containerPort: 8428
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: victoria-metrics-scrape
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  selector:
    app: victoria-metrics
  ports:
    - port: 8428
      targetPort: 8428
