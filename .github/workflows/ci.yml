# main 에 push 하거나 PR 을 올리면 백엔드 테스트와 프론트 lint·빌드를 돌린다.
# 실제 DB·Gemini 없이 가짜 객체로 테스트하므로 시크릿이 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새로 push 하면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system:
    name: system (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/system
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # Dockerfile 의 python:3.12-slim 과 맞춘다
          cache: pip
          cache-dependency-path: projects/system/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  react-app:
    name: react-app (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/react-app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4   # package.json 의 packageManager(pnpm@10.23.0) 버전을 쓴다
        with:
          package_json_file: projects/react-app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # Dockerfile 의 node:24-alpine 과 맞춘다
          cache: pnpm
          cache-dependency-path: projects/react-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
